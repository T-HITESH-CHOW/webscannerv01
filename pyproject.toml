[project]
name = "security-review-tool"
version = "0.1.0"
description = "Learning tool for security scanning concepts"
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.111.0",
    "uvicorn[standard]==0.30.1",
    "pydantic==2.7.4",
    "pydantic-settings==2.3.3",
    "python-multipart==0.0.9",
    "semgrep==1.98.0",
    "anthropic==0.39.0",
    "python-dotenv==1.0.1",
    "httpx==0.27.0",
    "jinja2==3.1.4",
    "streamlit==1.37.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.2.2",
    "pytest-asyncio==0.23.3",
    "ruff==0.5.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["backend"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 100
target-version = "py310"